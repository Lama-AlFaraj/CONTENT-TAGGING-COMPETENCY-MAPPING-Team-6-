apiVersion: apps/v1
kind: Deployment
metadata:
  name: beamdata-ai-hub
  namespace: shahad
  labels:
    app: beamdata-ai-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beamdata-ai-hub
  template:
    metadata:
      labels:
        app: beamdata-ai-hub
    spec:
      containers:
        - name: ai-hub
          image: beamdata-ai-hub:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: V8_API_URL
              value: "http://beamdata-v8-api:8000/predict"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: beamdata-ai-hub
  namespace: shahad
spec:
  type: ClusterIP
  selector:
    app: beamdata-ai-hub
  ports:
    - port: 8000
      targetPort: 8000
